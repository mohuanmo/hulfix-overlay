name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle with caching
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.0.2
        cache-read-only: false

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.gradle/daemon
          ~/.gradle/native
          ~/.android/build-cache
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Calculate Version Code
      run: |
        VERSION_CODE=$(git rev-list --count HEAD)
        echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
        echo "Version code: $VERSION_CODE"

    - name: Build Debug APK
      run: |
        gradle assembleDebug --no-daemon --stacktrace --init-script init.gradle -PversionCode=$VERSION_CODE
      timeout-minutes: 10

    - name: Verify APK exists and check size
      run: |
        ls -la app/build/outputs/apk/debug/
        APK_SIZE=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)
        echo "APK size: $APK_SIZE bytes"
        if [ "$APK_SIZE" -lt 10000 ]; then
          echo "❌ ERROR: APK size ($APK_SIZE bytes) is too small, build may have failed silently!"
          exit 1
        fi
        test -f app/build/outputs/apk/debug/app-debug.apk

    - name: Delete old release
      run: |
        gh release delete latest --yes || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Push to GitHub Releases
      uses: softprops/action-gh-release@v1
      with:
        tag_name: latest
        name: HULFix Overlay Latest Build
        body: Auto-built APK for custom Heads-Up notification overlay.
        files: app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
