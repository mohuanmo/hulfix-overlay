name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-

    - name: Install Gradle manually
      run: |
        wget --tries=3 --timeout=30 https://services.gradle.org/distributions/gradle-8.0-bin.zip -O gradle.zip
        unzip -q gradle.zip
        mv gradle-8.0 $HOME/gradle
        echo "$HOME/gradle/bin" >> $GITHUB_PATH
        gradle --version

    - name: Build Debug APK
      run: |
        for i in 1 2 3; do
          gradle assembleDebug --no-daemon --stacktrace && break
          echo "Build attempt $i failed, retrying in 30s..."
          sleep 30
        done

    - name: Delete old release
      run: |
        gh release delete latest --yes || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Push to GitHub Releases
      uses: softprops/action-gh-release@v1
      with:
        tag_name: latest
        name: HULFix Overlay Latest Build
        body: Auto-built APK for custom Heads-Up notification overlay.
        files: app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
