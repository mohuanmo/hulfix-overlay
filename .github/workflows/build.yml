name: Build and Release APK (Versioned Release)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle with caching
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.0.2
        cache-read-only: false

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.gradle/daemon
          ~/.gradle/native
          ~/.android/build-cache
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Calculate Version Code
      run: |
        VERSION_CODE=$(git rev-list --count HEAD)
        echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
        echo "Version code: $VERSION_CODE"

    - name: Extract Version Name
      id: version
      run: |
        VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
        echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "Version name: $VERSION_NAME"

    - name: Build Debug APK
      run: |
        gradle assembleDebug --no-daemon --stacktrace --init-script init.gradle -PversionCode=$VERSION_CODE
      timeout-minutes: 10

    - name: Verify APK exists and check size
      run: |
        ls -la app/build/outputs/apk/debug/
        APK_SIZE=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)
        echo "APK size: $APK_SIZE bytes"
        if [ "$APK_SIZE" -lt 10000 ]; then
          echo "ERROR: APK size ($APK_SIZE bytes) is too small, build may have failed silently!"
          exit 1
        fi
        test -f app/build/outputs/apk/debug/app-debug.apk

    - name: Push to GitHub Releases (Versioned)
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version_name }}
        name: HULFix Overlay v${{ steps.version.outputs.version_name }}
        body: |
          HULFix Overlay v${{ steps.version.outputs.version_name }} — LSPosed module for custom Heads-Up notifications.

          **Changelog:**
          - Performance: Removed 141 diagnostic log lines, reducing runtime overhead
          - iOS 26 Liquid Glass visual redesign (10-layer glass stack)
          - Android 12+ hardware blur via RenderEffect with colorMatrix tint
          - Radial gradient opacity mask (center → edge thickness variation)
          - 4-phase organic enter animation (condensation → burst → settle → calm)
        files: app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
